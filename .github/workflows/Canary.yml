name: Canary Build

on:
  - workflow_dispatch

jobs:       
  build:
    strategy:
      matrix:
        configuration: [Release]
        platform: [x64, arm64]
    runs-on: windows-2025-vs2026  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on
    env:
      Solution_Name: HyPlayer.slnx                       # Replace with your solution name, i.e. MyWpfApp.sln.
      Wap_Project_Directory: HyPlayer.Package    # Replace with the Wap project directory relative to the solution, i.e. MyWpfApp.Package.
      Wap_Project_Path: HyPlayer.Package\HyPlayer.Package.wapproj                   # Replace with the path to your Wap project, i.e. MyWpf.App.Package\MyWpfApp.Package.wapproj.

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: true

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Add  MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2
      
    # Restore the application to populate the obj folder with RuntimeIdentifiers
    - name: Restore the application
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration /p:RuntimeIdentifier=win-x64 /p:Platform=$env:Platform
      if: ${{matrix.platform == 'x64'}}
      env:
        Configuration: ${{ matrix.configuration }}
        Platform: ${{ matrix.platform }}
        
    - name: Restore the application
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration /p:RuntimeIdentifier=win-arm64 /p:Platform=$env:Platform
      if: ${{matrix.platform == 'arm64'}}
      env:
        Configuration: ${{ matrix.configuration }}
        Platform: ${{ matrix.platform }}
        
    - name: Set AppxManifest Version and Package Name
      shell: pwsh
      run: |
              $MANIFEST = [xml](Get-Content HyPlayer.Package\Package.appxmanifest)
              $VERSION = $MANIFEST.Package.Identity.Version
              "VERSION=$VERSION" >> $env:GITHUB_ENV
              echo "Currently Building Version Is"
              echo $VERSION
              $MANIFEST.Package.Identity.Name = "48848aaaaaaccd.HyPlayer"
              $MANIFEST.Package.Identity.Publisher = "CN=Test certificate for 'HyPlayer [OSS]'"
              $MANIFEST.Package.Applications.Application.VisualElements.DisplayName = "HyPlayer"
              Set-Content -Path HyPlayer.Package\Package.appxmanifest -Value $MANIFEST.OuterXml
    - name: Set BuildInfo Version
      shell: pwsh
      run: |
              # 替换 BuildInfo.cs 中的占位符
              $buildInfoPath = "HyPlayer/Classes/BuildInfo.cs"
              if (Test-Path $buildInfoPath) {
                $content = Get-Content $buildInfoPath -Raw
              $commitSha = "${{github.sha}}"
              $buildTime = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
              $jobId = "${{github.run_number}}"
              $branchId = "${{github.ref_name}}"
              $content = $content -replace "__COMMIT_SHA__", "$commitSha"
              $content = $content -replace "__BUILD_TIME__", "$buildTime"
              $content = $content -replace "__BUILD_JOB_ID__", "$jobId"
              $content = $content -replace "__BUILD_BRANCH_ID__", "$branchId"
              Set-Content -Path $buildInfoPath -Value $content
              echo "BuildInfo.cs has been updated with:"
              echo "  Commit SHA: $commitSha"
              echo "  Build Time: $buildTime"
              echo "  Job ID: $jobId"
              } else {
              echo "BuildInfo.cs not found at $buildInfoPath"
              }
    - name: Set LastFM Constants
      shell: pwsh
      run: |
              # 替换 LastFMConstants.cs 中的占位符
              $infoPath = "HyPlayer/Classes/LastFMConstants.cs"
              if (Test-Path $infoPath) {
                $content = Get-Content $infoPath -Raw
              $apiKey = "${{secrets.LAST_FM_APIKEY}}"
              $secret = "${{secrets.LAST_FM_SECRET}}"
              $content = $content -replace "LAST_FM_APIKEY", "$apiKey"
              $content = $content -replace "LAST_FM_SECRET", "$secret"
              Set-Content -Path $infoPath -Value $content
              echo "LastFMConstants.cs has been updated."
              } else {
              echo "LastFMConstants.cs not found at $infoPath"
              }
    # Create the app package by building and packaging the Windows Application Packaging project
    - name: Create the app package
      run: msbuild $env:Wap_Project_Path /p:Configuration=$env:Configuration /p:UapAppxPackageBuildMode=$env:Appx_Package_Build_Mode /p:AppxBundle=$env:Appx_Bundle /p:Platform=$env:Platform /p:RuntimeIdentifier=win-x64 /p:AppxPackageSigningEnabled=false
      if: ${{matrix.platform == 'x64'}}
      env:
        Appx_Bundle: Never
        Appx_Package_Build_Mode: SideloadOnly
        Configuration: ${{ matrix.configuration }}
        Platform: ${{ matrix.platform }}
        
    - name: Create the app package
      run: msbuild $env:Wap_Project_Path /p:Configuration=$env:Configuration /p:UapAppxPackageBuildMode=$env:Appx_Package_Build_Mode /p:AppxBundle=$env:Appx_Bundle /p:Platform=$env:Platform /p:RuntimeIdentifier=win-arm64 /p:AppxPackageSigningEnabled=false
      if: ${{matrix.platform == 'arm64'}}
      env:
        Appx_Bundle: Never
        Appx_Package_Build_Mode: SideloadOnly
        Configuration: ${{ matrix.configuration }}
        Platform: ${{ matrix.platform }}


    # Upload the MSIX package: https://github.com/marketplace/actions/upload-a-build-artifact
    - name: Upload Unsigned Artifact
      id: upload-unsigned-artifact
      uses: actions/upload-artifact@v4
      with:
        name: HyPlayer-Build-${{ matrix.platform }}
        path: ${{ env.Wap_Project_Directory }}\AppPackages\**\HyPlayer.Package_*.msix

    - name: Code Signing
      uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
        organization-id: 'cded843b-8dbb-4711-b75a-4265b8e55a12'
        project-slug: 'HyPlayer'
        signing-policy-slug: 'test'
        github-artifact-id: '${{ steps.upload-unsigned-artifact.outputs.artifact-id }}'
        wait-for-completion: true
        output-artifact-directory: 'OutputArtifacts'  

    - name: Upload build artifacts 
      uses: ncipollo/release-action@v1
      with:
        artifacts: 'OutputArtifacts\**\HyPlayer.Package_*.msix'
        allowUpdates: true
        artifactErrorsFailBuild: true
        name: "HyPlayer Canary Build ${{ env.VERSION }}"
        replacesArtifacts: true
        draft: true
        bodyFile: CHANGELOG.md
        tag: "${{ env.VERSION }}"
        
    - name: Upload to Server
      shell: pwsh
      run: |
          $BUNDLEPATH = (Get-ChildItem -Path "OutputArtifacts" -Include *.msix -Recurse) | Foreach-Object {$_.FullName}
          $FILENAME = (Get-ChildItem -Path "OutputArtifacts" -Include *.msix -Recurse) | Foreach-Object {$_.Name}
          $VERSION = "${{ env.VERSION }}"
          $alistServer = "https://hyplayer-file.kengwang.com.cn"
          $loginData = @{
            "username" = "admin"
            "password" = "${{ secrets.OPENLIST_TOKEN }}"
          } | ConvertTo-Json

          $response = Invoke-WebRequest -Uri "$alistServer/api/auth/login" `
              -Method POST `
              -Body $loginData `
              -ContentType "application/json"

          $token = ($response.Content | ConvertFrom-Json).data.token

          $localFilePath = $BUNDLEPATH
          $remoteFilePath = "/hyplayer/release/$FILENAME"

          $headers = @{
              "Authorization" = $token
              "Content-Type" = "application/octet-stream"
              "File-Path" = $remoteFilePath
          }

          Invoke-WebRequest -Uri "$alistServer/api/fs/put" `
              -Method Put `
              -Headers $headers `
              -InFile $localFilePath
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding UTF8 | Out-String
          Write-Host $changelog
          $bodyObject = @{
            channels = @(5)
            version  = $VERSION
            authKey  = "${{ secrets.SERVER_API_KEY }}"
            date     = (Get-Date -Format o)
            note     = $changelog
            url      = "https://hyplayer-file.kengwang.com.cn$remoteFilePath"
          }
          $body = $bodyObject | ConvertTo-Json -Compress -EscapeHandling EscapeNonAscii
          $response = Invoke-WebRequest -Uri 'https://hyplayer.kengwang.com.cn/releases' -Method PUT -ContentType 'application/json' -Body $body