# Universal Windows Platform
# Build a Universal Windows Platform project using Visual Studio.
# Add steps that test and distribute an app, save build artifacts, and more:
# https://aka.ms/yaml

trigger:
  branches:
    include:
      - develop
  paths:
    include:
      - CHANGELOG_RELEASE.md


pool:
  vmImage: 'windows-2022'

variables:
  - group: HyPlayerDevelopBuild

steps:

  - checkout: self
    submodules: true

  - task: UseDotNet@2
    displayName: 'Use .NET 6'
    inputs:
      version: 6.0.x

  - task: NuGetToolInstaller@1
  
  - task: NuGetCommand@2
    inputs:
      command: 'restore'
      restoreSolution: '$(solution)'
      feedsToUse: 'config'
      nugetConfigPath: 'nuget.config'


  - powershell: |
      $MANIFEST = [xml](Get-Content **\Package.appxmanifest)
      $MAINVERSION = $MANIFEST.Package.Identity.Version -replace ".{1}$"
      $VERSION = $MAINVERSION + $(Build.BuildId)
      Write-Host("##vso[task.setvariable variable=VERSION]$VERSION")
      echo "Currently Building Version Is"
      echo $VERSION
      $MANIFEST.Package.Identity.Version = $VERSION
      Set-Content -Path **\Package.appxmanifest -Value $MANIFEST.OuterXml
    displayName: 'Set Version'

  - task: DownloadSecureFile@1
    name: certificate
    displayName: 'Download CA certificate'
    inputs:
      secureFile: '$(signingCert.secureFilePath)'

  - task: VSBuild@1
    displayName: 'Build solution HyPlayer.sln'
    inputs:
      solution: '$(solution)'
      msbuildArgs: '/p:AppxBundlePlatforms="$(buildPlatform)" /p:AppxPackageDir="$(Build.ArtifactStagingDirectory)\AppxPackages\\" /p:AppxBundle=Always /p:PackageCertificateThumbprint=""  /p:UapAppxPackageBuildMode=SideloadOnly  /p:AppxPackageSigningEnabled=true  /p:PackageCertificateKeyFile="$(certificate.secureFilePath)" /p:PackageCertificatePassword="$(signingCert.password)"'
      platform: x64
      configuration: '$(buildConfiguration)'
      clean: true
      msbuildArchitecture: x64

  - powershell: |
      cd "$(Build.ArtifactStagingDirectory)\AppxPackages\"
      $SYMPATH = (Get-ChildItem -Include *.appxsym -Recurse) | Foreach-Object {$_.FullName}
      New-Item -ItemType Directory $(Agent.HomeDirectory)/SYMS
      Move-Item $SYMPATH $(Agent.HomeDirectory)/SYMS
      $BUNDLEPATH = (Get-ChildItem -Include *.msixbundle -Recurse) | Foreach-Object {$_.FullName}
      Write-Host("##vso[task.setvariable variable=BUNDLEPATH]$BUNDLEPATH")
    displayName: 'Move Symbol Files and write publish file location'

  - task: PublishBuildArtifacts@1
    displayName: 'Publish artifact: drop'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)\AppxPackages'
      ArtifactName: 'azure-$(VERSION)'
    condition: succeededOrFailed()

  - task: ArchiveFiles@2
    displayName: 'Archive Symbol Files'
    inputs:
      rootFolderOrFile: '$(Agent.HomeDirectory)/SYMS'
      archiveFile: '$(Agent.HomeDirectory)/$(Build.BuildId).SYMS.zip'
      verbose: true

  - task: GitHubRelease@1
    inputs:
      gitHubConnection: 'github connection 1'
      repositoryName: 'HyPlayer/HyPlayer'
      action: 'create'
      target: '$(Build.SourceVersion)'
      tagSource: 'userSpecifiedTag'
      tag: '$(VERSION)'
      title: 'V$(VERSION)'
      releaseNotesFilePath: 'CHANGELOG_RELEASE.md'
      assets: '$(BUNDLEPATH)'
      addChangeLog: false

  - powershell: |
      $BUNDLEPATH = (Get-ChildItem -Path "$(Build.ArtifactStagingDirectory)/AppxPackages/" -Include *.msixbundle -Recurse) | Foreach-Object {$_.FullName}
      $MANIFEST = [xml](Get-Content **\Package.appxmanifest)
      $MAINVERSION = $MANIFEST.Package.Identity.Version
      $VERSION = $MAINVERSION
      $alistServer = "https://hyplayer-file.kengwang.com.cn"
      $loginData = @{
          "username" = "admin"
          "password" = "$(alist_token)"
      } | ConvertTo-Json

      $response = Invoke-WebRequest -Uri "$alistServer/api/auth/login" `
          -Method POST `
          -Body $loginData `
          -ContentType "application/json"

      $token = ($response.Content | ConvertFrom-Json).data.token

      $localFilePath = $BUNDLEPATH
      $remoteFilePath = "/hyplayer/release/$VERSION.msixbundle"

      $headers = @{
          "Authorization" = $token
          "Content-Type" = "application/octet-stream"
          "File-Path" = $remoteFilePath
      }

      Invoke-WebRequest -Uri "$alistServer/api/fs/put" `
          -Method Put `
          -Headers $headers `
          -InFile $localFilePath
      $changelog = Get-Content CHANGELOG_RELEASE.md -Raw -Encoding UTF8 | Out-String
      Write-Host $changelog
      $bodyObject = @{
        channels = @(5,6)
        version  = $VERSION
        authKey  = "$(hyplayerAPI.secretKey)"
        date     = (Get-Date -Format o)
        note     = $changelog
        url      = "https://hyplayer-file.kengwang.com.cn$remoteFilePath"
      }
      $body = $bodyObject | ConvertTo-Json -Compress -EscapeHandling EscapeNonAscii
      $response = Invoke-WebRequest -Uri 'https://hyplayer.kengwang.com.cn/releases' -Method PUT -ContentType 'application/json' -Body $body





  - task: PowerShell@2
    inputs:
      targetType: 'inline'
      script: |
        Invoke-WebRequest 'https://hyplayer.kengwang.com.cn/channel/5/broadcastUpdate/$(hyplayerAPI.secretKey)'
        Invoke-WebRequest 'https://hyplayer.kengwang.com.cn/channel/6/broadcastUpdate/$(hyplayerAPI.secretKey)'